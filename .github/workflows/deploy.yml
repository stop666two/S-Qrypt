name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Deploy (auto-create D1 + Worker)
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: node scripts/setup.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Set SETUP_TOKEN secret
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CF_SETUP_TOKEN != '' }}
        run: printf '%s' "$CF_SETUP_TOKEN" | npx wrangler secret put SETUP_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_SETUP_TOKEN: ${{ secrets.CF_SETUP_TOKEN }}

      - name: Warn if SETUP_TOKEN not configured
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CF_SETUP_TOKEN == '' }}
        run: |
          echo "⚠️  CF_SETUP_TOKEN 未设置：首次初始化将被拒绝 (503 setup_token_not_configured)"
          echo "  前往 Settings → Secrets → Actions → 添加 CF_SETUP_TOKEN"
          echo "  或本地运行: npx wrangler secret put SETUP_TOKEN"

      - name: Skip deploy (no API token)
        if: ${{ secrets.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "⚠️  CLOUDFLARE_API_TOKEN 未设置，跳过自动部署"
          echo ""
          echo "本地部署（无需 API Token）:"
          echo "  npx wrangler login && npm run setup"
          echo ""
          echo "设置 CI/CD:"
          echo "  前往 Settings → Secrets → Actions → 添加 CLOUDFLARE_API_TOKEN"
