name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Deploy (auto-create D1 + Worker)
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: node scripts/setup.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Skip deploy (no API token)
        if: ${{ secrets.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "⚠️  CLOUDFLARE_API_TOKEN 未设置，跳过自动部署"
          echo ""
          echo "本地部署（无需 API Token）:"
          echo "  npx wrangler login && npm run setup"
          echo ""
          echo "设置 CI/CD:"
          echo "  前往 Settings → Secrets → Actions → 添加 CLOUDFLARE_API_TOKEN"
