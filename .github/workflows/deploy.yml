name: CI

# 推送到 main 只跑门禁；部署在 Actions 页面点「Run workflow」显式触发。
# 原因：GitHub 不允许在 `if:` 里引用 secrets（解析期报 Unrecognized named-value，
# 整个 workflow 不创建任何 job），所以「有 token 才部署」不能写成条件判断。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Docs consistency
        run: npm run check:docs
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run

  deploy:
    # 只在手动触发时部署：push 不会把未审阅的提交直接推上生产。
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Deploy (create D1 + Worker)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN 未配置：跳过自动部署（Settings → Secrets → Actions 添加后重试）"
            exit 0
          fi
          node scripts/setup.mjs
      - name: Set SETUP_TOKEN secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_SETUP_TOKEN: ${{ secrets.CF_SETUP_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "跳过：缺少 CLOUDFLARE_API_TOKEN"
          elif [ -z "$CF_SETUP_TOKEN" ]; then
            echo "CF_SETUP_TOKEN 未配置：初始化接口会返回 503 setup_token_not_configured"
            echo "  去 Settings → Secrets → Actions → New secret 添加 CF_SETUP_TOKEN"
            echo "  或本地执行 npx wrangler secret put SETUP_TOKEN"
          else
            printf '%s' "$CF_SETUP_TOKEN" | npx wrangler secret put SETUP_TOKEN
          fi
